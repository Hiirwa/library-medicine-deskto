[package]
name = "library-medicine-desktop"
version = "1.2.0"
description = "Library Medicine desktop app: offline-first data collection that syncs with librarymedicine.online"
authors = ["Library Medicine"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# the _lib suffix avoids a name clash between the lib and bin targets on Windows
name = "library_medicine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "time", "macros", "rt-multi-thread"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
dirs = "6"
sha2 = "0.10"
hex = "0.4"
url = "2"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
